<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diagnostic Review | The Creative Lab</title>

<style>
:root{
  --black:#222;
  --charcoal:#343434;
  --grey:#707070;
  --line:#dedede;
  --soft:#f4f4f2;
  --cream:#F5F0E8;
  --sage:#A8AEA0;
  --plum:#6B4D59;
  --sand:#E5DFD3;
  --warm:#E6D8C7;
  --green:#DCE5D8;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  min-height:100%;
  font-family:Arial,Helvetica,sans-serif;
  color:var(--charcoal);
  background:#f4f4f2;
}

button,
input,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none !important;
}

/* LOGIN */

.login-shell{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:30px;
}

.login-card{
  width:min(430px,100%);
  padding:38px;
  background:#fff;
  border-radius:14px;
  box-shadow:0 15px 50px rgba(0,0,0,.08);
}

.login-brand{
  font-size:23px;
  font-weight:800;
  margin-bottom:42px;
}

.login-card h1{
  margin:0 0 10px;
  font-size:32px;
}

.login-card p{
  margin:0 0 28px;
  color:var(--grey);
  font-size:14px;
  line-height:1.5;
}

.field{
  margin-bottom:17px;
}

.field label{
  display:block;
  margin-bottom:7px;
  font-size:12px;
  font-weight:700;
}

.field input{
  width:100%;
  height:46px;
  padding:0 12px;
  border:1px solid #cfcfcf;
  border-radius:5px;
}

.login-button{
  width:100%;
  height:47px;
  border:0;
  border-radius:5px;
  background:#222;
  color:#fff;
  font-weight:700;
}

.login-error{
  min-height:18px;
  margin-top:13px;
  color:#9e3b3b;
  font-size:12px;
}

/* APP SHELL */

.app-shell{
  min-height:100vh;
  display:grid;
  grid-template-columns:205px minmax(0,1fr);
}

.sidebar{
  position:fixed;
  inset:0 auto 0 0;
  width:205px;
  padding:26px 18px;
  background:#202020;
  color:#fff;
  display:flex;
  flex-direction:column;
}

.sidebar-brand{
  font-size:19px;
  font-weight:800;
  margin-bottom:36px;
}

.sidebar-label{
  margin-bottom:9px;
  padding-left:8px;
  font-size:10px;
  letter-spacing:.13em;
  text-transform:uppercase;
  color:#8e8e8e;
}

.sidebar-link{
  display:flex;
  align-items:center;
  gap:10px;
  min-height:42px;
  padding:0 11px;
  border-radius:5px;
  font-size:13px;
  color:#ddd;
}

.sidebar-link.active{
  background:#353535;
  color:#fff;
}

.sidebar-spacer{
  flex:1;
}

.signout{
  border:0;
  background:transparent;
  color:#fff;
  text-align:left;
  padding:10px;
  font-size:12px;
}

.main{
  grid-column:2;
  min-width:0;
}

.topbar{
  height:67px;
  padding:0 25px;
  background:#fff;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.topbar-title{
  font-size:17px;
  font-weight:700;
}

.current-user{
  font-size:11px;
  color:var(--grey);
}

/* DIAGNOSTIC LIST VIEW */

.list-view{
  padding:28px;
}

.list-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.list-head h1{
  margin:0;
  font-size:26px;
}

.refresh{
  border:0;
  background:transparent;
  text-decoration:underline;
  font-size:12px;
}

.diagnostic-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:14px;
}

.diagnostic-card{
  padding:19px;
  border:1px solid var(--line);
  border-radius:9px;
  background:#fff;
  text-align:left;
}

.diagnostic-card:hover{
  border-color:#aaa;
}

.card-company{
  font-size:15px;
  font-weight:800;
  margin-bottom:6px;
}

.card-meta{
  font-size:11px;
  line-height:1.5;
  color:var(--grey);
}

.status-pill{
  display:inline-block;
  margin-top:10px;
  padding:5px 8px;
  border-radius:20px;
  background:#eeeae1;
  font-size:9px;
  font-weight:800;
  letter-spacing:.06em;
  text-transform:uppercase;
}

/* REVIEW PAGE */

.review-view{
  min-height:calc(100vh - 67px);
  background:#f2f2f0;
}

.review-header{
  padding:18px 22px;
  background:#fff;
  border-bottom:1px solid var(--line);
}

.back-link{
  display:inline-block;
  margin-bottom:17px;
  border:0;
  background:transparent;
  padding:0;
  font-size:12px;
  color:#555;
}

.review-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:25px;
}

.client-block{
  min-width:0;
}

.client-name{
  font-size:25px;
  font-weight:800;
  margin-bottom:6px;
}

.client-meta{
  font-size:12px;
  color:var(--grey);
  line-height:1.5;
}

.review-actions{
  display:flex;
  align-items:center;
  gap:9px;
}

.timer-box{
  min-width:205px;
  padding:12px 16px;
  border:1px solid var(--line);
  border-radius:7px;
  background:#fff;
}

.timer-label{
  font-size:11px;
  color:var(--grey);
  margin-bottom:4px;
}

.timer-value{
  font-size:14px;
  font-weight:700;
}

.timer-date{
  margin-top:3px;
  font-size:10px;
  color:#8a8a8a;
}

.action-button{
  height:42px;
  padding:0 15px;
  border:1px solid #cfcfcf;
  border-radius:5px;
  background:#fff;
  font-size:12px;
  font-weight:700;
}

.action-button.dark{
  background:#222;
  border-color:#222;
  color:#fff;
}

.action-button:disabled{
  opacity:.4;
  cursor:not-allowed;
}

/* 3 PANEL WORKSPACE */

.workspace{
  display:grid;
  grid-template-columns:245px minmax(330px,.9fr) minmax(420px,1.15fr);
  min-height:calc(100vh - 185px);
}

.section-nav{
  background:#fff;
  border-right:1px solid var(--line);
  padding:20px 14px;
}

.section-nav-title{
  margin:0 8px 14px;
  font-size:14px;
  font-weight:800;
}

.section-button{
  width:100%;
  min-height:43px;
  padding:0 12px;
  border:0;
  border-bottom:1px solid #e8e8e8;
  background:#fff;
  text-align:left;
  font-size:12px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.section-button:hover{
  background:#f8f8f7;
}

.section-button.active{
  background:#eeeeec;
  font-weight:700;
}

.section-arrow{
  color:#999;
  font-size:14px;
}

/* EDITOR */

.editor-panel{
  min-width:0;
  background:#fafafa;
  border-right:1px solid var(--line);
  display:flex;
  flex-direction:column;
}

.panel-head{
  height:55px;
  padding:0 17px;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  font-size:14px;
  font-weight:800;
  background:#fff;
}

.editor-content{
  flex:1;
  padding:20px;
}

.editor-section-title{
  font-size:16px;
  font-weight:800;
  margin-bottom:18px;
}

.editor-field{
  margin-bottom:18px;
}

.editor-field label{
  display:block;
  margin-bottom:7px;
  font-size:10px;
  font-weight:800;
  letter-spacing:.04em;
  text-transform:uppercase;
  color:#666;
}

.editor-input{
  width:100%;
  min-height:210px;
  padding:13px;
  border:1px solid #ccc;
  border-radius:5px;
  resize:vertical;
  background:#fff;
  line-height:1.45;
  font-size:13px;
}

.editor-input.headline{
  min-height:80px;
  font-weight:700;
}

.editor-footer{
  padding:14px 18px;
  border-top:1px solid var(--line);
  background:#fff;
  display:flex;
  justify-content:flex-end;
  gap:9px;
}

.save-button{
  min-height:41px;
  padding:0 18px;
  border:0;
  border-radius:5px;
  background:#222;
  color:#fff;
  font-size:12px;
  font-weight:700;
}

.cancel-button{
  min-height:41px;
  padding:0 18px;
  border:1px solid #ccc;
  border-radius:5px;
  background:#fff;
  font-size:12px;
  font-weight:700;
}

/* PREVIEW */

.preview-panel{
  min-width:0;
  background:#f1f1ef;
}

.preview-head{
  height:55px;
  padding:0 16px;
  border-bottom:1px solid var(--line);
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.preview-head strong{
  font-size:14px;
}

.preview-switch{
  display:flex;
  gap:5px;
}

.preview-toggle{
  height:31px;
  padding:0 12px;
  border:1px solid #ddd;
  background:#fff;
  font-size:11px;
}

.preview-toggle.active{
  border-bottom:2px solid #222;
  font-weight:700;
}

.preview-scroll{
  height:calc(100vh - 240px);
  overflow:auto;
  padding:22px;
}

.email{
  width:100%;
  max-width:620px;
  margin:0 auto;
  padding:30px;
  background:var(--cream);
  transition:max-width .2s ease;
}

.email.mobile{
  max-width:360px;
}

.email-brand{
  margin-bottom:24px;
  font-size:11px;
  font-weight:800;
  letter-spacing:.12em;
  text-transform:uppercase;
}

.email p{
  margin:0 0 16px;
  font-size:13px;
  line-height:1.5;
}

.email h3{
  margin:26px 0 8px;
  font-size:12px;
  text-transform:uppercase;
}

/* Brand Pulse score: approved XD proportions and typography */
.score-panel{margin:21px 0 27px;padding:12px 18px;border-radius:13px;background:var(--sage);display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:151px}
.score-panel-title{flex:1;min-width:0;color:#222;font-size:clamp(18px,2.15vw,25px);line-height:1.08;letter-spacing:-.035em}
.score-panel-title strong,.score-panel-title span{display:block}
.score-panel-title strong{font-weight:900}
.score-panel-title span{font-weight:400}
.score-donut{position:relative;width:136px;height:136px;flex:0 0 136px}
.score-donut svg{display:block;width:100%;height:100%}
.score-donut-centre{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:translateY(-1px)}
.score-donut-value{font-size:46px;line-height:.96;letter-spacing:-.055em;font-weight:900;color:var(--cream)}
.score-donut-divider{width:56px;height:1px;margin:4px 0;background:var(--charcoal)}
.score-donut-total{font-size:26px;font-weight:300;line-height:.96;color:#111}
.email.mobile .score-panel{padding:9px;gap:6px;min-height:112px}
.email.mobile .score-panel-title{font-size:14px}
.email.mobile .score-donut{width:96px;height:96px;flex-basis:96px}
.email.mobile .score-donut-value{font-size:32px}
.email.mobile .score-donut-total{font-size:18px}
.email.mobile .score-donut-divider{width:37px;margin:3px 0}
.email-contacts{
  margin-top:24px;
  background:#D6D9D1;
  border-radius:14px;
  padding:22px 12px;
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  font-size:11px;
  text-align:center;
  line-height:1.5;
}
.email-contacts .person{padding:0 7px;min-width:0}
.email-contacts .person:first-child{border-right:1px solid #8f918c}
.email-contacts a{color:var(--charcoal);text-decoration:underline;overflow-wrap:anywhere}

.divider{
  height:1px;
  margin:25px 0;
  background:#aaa;
}

.area{
  display:grid;
  grid-template-columns:70px 1fr;
  gap:15px;
  padding:18px 0;
  border-bottom:1px solid #aaa;
}

.area-circle{
  width:62px;
  height:62px;
  border-radius:50%;
  background:#ddd8cf;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  font-size:21px;
  font-weight:800;
  line-height:1;
}

.area-circle small{
  margin-top:4px;
  font-size:9px;
  font-weight:400;
}

.area-title{
  margin-bottom:5px;
  font-size:13px;
  font-weight:800;
}

.area-headline{
  margin-bottom:5px;
  font-size:13px;
  line-height:1.35;
  font-weight:700;
}

.area-copy{
  font-size:12px;
  line-height:1.5;
}

.path{
  padding:14px 0;
  border-top:1px solid #aaa;
}

.path strong{
  font-size:12px;
}

.book-call{
  width:180px;
  margin:24px auto;
  padding:12px;
  border-radius:4px;
  background:var(--plum);
  color:#fff;
  text-align:center;
  font-size:12px;
  font-weight:700;
}

.message{
  margin:12px 22px 0;
  padding:10px 13px;
  border-radius:5px;
  background:var(--green);
  font-size:11px;
}

.message.warning{
  background:#f0ded0;
}

@media(max-width:1150px){
  .workspace{
    grid-template-columns:210px minmax(300px,1fr);
  }

  .preview-panel{
    display:none;
  }
}

@media(max-width:760px){
  .app-shell{
    display:block;
  }

  .sidebar{
    position:static;
    width:100%;
    height:58px;
    padding:0 15px;
    flex-direction:row;
    align-items:center;
  }

  .sidebar-brand{
    margin:0;
  }

  .sidebar-label,
  .sidebar-link{
    display:none;
  }

  .sidebar-spacer{
    flex:1;
  }

  .main{
    width:100%;
  }

  .review-top{
    flex-direction:column;
  }

  .review-actions{
    width:100%;
    flex-wrap:wrap;
  }

  .timer-box{
    width:100%;
  }

  .workspace{
    display:block;
  }

  .section-nav{
    border-right:0;
    border-bottom:1px solid var(--line);
  }

  .editor-panel{
    border-right:0;
  }
}
</style>
</head>

<body>

<div id="loginScreen" class="login-shell">

  <div class="login-card">

    <div class="login-brand">
      The Creative Lab
    </div>

    <h1>
      Diagnostic Review
    </h1>

    <p>
      Private access for authorised Creative Lab reviewers.
    </p>

    <div class="field">
      <label>Email</label>
      <input id="loginEmail" type="email">
    </div>

    <div class="field">
      <label>Password</label>
      <input id="loginPassword" type="password">
    </div>

    <button id="loginButton" class="login-button">
      Sign In
    </button>

    <div id="loginError" class="login-error"></div>

  </div>

</div>


<div id="appScreen" class="app-shell hidden">

  <aside class="sidebar">

    <div class="sidebar-brand">
      The Creative Lab
    </div>

    <div class="sidebar-label">
      Internal
    </div>

    <div class="sidebar-link active">
      Diagnostics
    </div>

    <div class="sidebar-spacer"></div>

    <button id="signOutButton" class="signout">
      Log out
    </button>

  </aside>


  <main class="main">

    <header class="topbar">

      <div class="topbar-title">
        Brand Performance Diagnostic
      </div>

      <div id="currentUser" class="current-user"></div>

    </header>


    <section id="listView" class="list-view">

      <div class="list-head">

        <h1>
          Diagnostics
        </h1>

        <button id="refreshButton" class="refresh">
          Refresh
        </button>

      </div>

      <div id="diagnosticGrid" class="diagnostic-grid"></div>

    </section>


    <section id="reviewView" class="review-view hidden">

      <div class="review-header">

        <button id="backButton" class="back-link">
          ← Back to diagnostics
        </button>


        <div class="review-top">

          <div class="client-block">

            <div id="clientName" class="client-name"></div>

            <div id="clientMeta" class="client-meta"></div>

          </div>


          <div class="review-actions">

            <div class="timer-box">

              <div class="timer-label">
                Scheduled to send
              </div>

              <div id="timerValue" class="timer-value"></div>

              <div id="timerDate" class="timer-date"></div>

            </div>


            <button id="pauseButton" class="action-button">
              Pause Send
            </button>

            <button id="approveButton" class="action-button dark">
              Approve &amp; Send
            </button>

          </div>

        </div>

      </div>


      <div id="statusMessage"></div>


      <div class="workspace">

        <aside class="section-nav">

          <div class="section-nav-title">
            Edit email content
          </div>

          <div id="sectionNav"></div>

        </aside>


        <section class="editor-panel">

          <div class="panel-head">
            Edit section
          </div>

          <div id="editorContent" class="editor-content"></div>

          <div class="editor-footer">

            <button id="cancelButton" class="cancel-button">
              Cancel
            </button>

            <button id="saveButton" class="save-button">
              Save Changes
            </button>

          </div>

        </section>


        <section class="preview-panel">

          <div class="preview-head">

            <strong>
              Email preview
            </strong>

            <div class="preview-switch">

              <button
                id="desktopButton"
                class="preview-toggle active"
              >
                Desktop
              </button>

              <button
                id="mobileButton"
                class="preview-toggle"
              >
                Mobile
              </button>

            </div>

          </div>

          <div class="preview-scroll">

            <div id="emailPreview"></div>

          </div>

        </section>

      </div>

    </section>

  </main>

</div>

function escapeHtml(value){

  return String(value ?? '')
    .replace(
      /[&<>"']/g,
      ch=>({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#039;'
      })[ch]
    );
}


function formatDate(value){

  if(!value){
    return '';
  }


  return new Date(value)
    .toLocaleString(
      'en-GB',
      {
        dateStyle:'medium',
        timeStyle:'short'
      }
    );
}


function firstName(value){

  return String(value || '')
    .trim()
    .split(/\s+/)[0] ||
    'there';
}

async function loadReports(){

    'Loading…';


  const {
    data,

    await supabase
      .from('diagnostic_reports')

  function pulseArcSvg(score){
    const value=Math.max(0,Math.min(100,Number(score)||0));
    const totalDegrees=value*3.6;
    const radius=45;
    const pt=(degrees)=>{
      const rad=(degrees-90)*Math.PI/180;
      return [60+radius*Math.cos(rad),60+radius*Math.sin(rad)];
    };
    const toHex=n=>Math.round(n).toString(16).padStart(2,'0');
    const start=[107,77,89]; // locked plum #6B4D59
    const finish=[199,179,187]; // graduated lighter plum
    const segments=Math.max(1,Math.ceil(totalDegrees/2));
    let lines='';
    for(let i=0;i<segments && value>0;i++){
      const startAngle=totalDegrees*i/segments;
      const endAngle=totalDegrees*(i+1)/segments;
      const mix=segments===1?0:i/(segments-1);
      const color='#'+start.map((n,j)=>toHex(n+(finish[j]-n)*mix)).join('');
      const [x1,y1]=pt(startAngle);
      const [x2,y2]=pt(endAngle+Math.min(.18,totalDegrees/segments*.2));
      lines+=`<path d="M ${x1.toFixed(3)} ${y1.toFixed(3)} L ${x2.toFixed(3)} ${y2.toFixed(3)}" stroke="${color}" stroke-width="16" fill="none"/>`;
    }
    if(value>0){
      const [sx,sy]=pt(0),[ex,ey]=pt(totalDegrees);
      lines+=`<circle cx="${sx}" cy="${sy}" r="8" fill="#6B4D59"/>`;
      lines+=`<circle cx="${ex}" cy="${ey}" r="8" fill="#C7B3BB"/>`;
    }
    return `<svg viewBox="0 0 120 120" aria-hidden="true" focusable="false"><circle cx="60" cy="60" r="45" fill="none" stroke="#F5F0E8" stroke-width="16"/>${lines}</svg>`;
  }

function scoreDonut(score){
  const shown=Math.round(Math.max(0,Math.min(100,Number(score)||0)));
  return `<div class="score-donut" role="img" aria-label="Brand Pulse performance score: ${shown} out of 100">
    ${pulseArcSvg(score)}
    <div class="score-donut-centre" aria-hidden="true">
      <div class="score-donut-value">${shown}</div>
      <div class="score-donut-divider"></div>
      <div class="score-donut-total">100</div>
    </div></div>`;
}

function startCountdown(){

  if(countdownTimer){

    clearInterval(
      countdownTimer
    );
  }


  updateCountdown();


  countdownTimer=
    setInterval(
      updateCountdown,
      1000
    );
}


function updateCountdown(){

  if(!selectedReport){
    return;
  }


  if(
    selectedReport.status===
    'paused'
  ){

    timerValue.textContent=
      'Send paused';

    timerDate.textContent=
      'Waiting for reviewer approval';

    return;
  }


  if(
    selectedReport.status===
    'sent'
  ){

    timerValue.textContent=
      'Email sent';

    timerDate.textContent=
      formatDate(
        selectedReport.sent_at
      );

    return;
  }


  if(
    selectedReport.status===
    'approved'
  ){

    timerValue.textContent=
      'Approved for sending';

    timerDate.textContent=
      formatDate(
        selectedReport.approved_at
      );

    return;
  }


  const sendTime=
    new Date(
      selectedReport.scheduled_send_at
    ).getTime();


  const diff=
    sendTime-
    Date.now();


  if(diff<=0){

    timerValue.textContent=
      'Scheduled send time reached';

    timerDate.textContent=
      formatDate(
        selectedReport.scheduled_send_at
      );

    return;
  }


  const hours=
    Math.floor(
      diff/
      3600000
    );


  const minutes=
    Math.floor(
      (
        diff%
        3600000
      )/
      60000
    );


  timerValue.textContent=
    `in ${hours}h ${minutes}m`;


  timerDate.textContent=
    formatDate(
      selectedReport.scheduled_send_at
    );
}

      }
    );

}

pauseButton.addEventListener(
  'click',
  async ()=>{

    const paused=
      selectedReport.status===
      'paused';


    const update={

      status:
        paused
          ? 'draft'
          : 'paused',

      updated_at:
        new Date()
          .toISOString()

    };


    if(paused){

      update.scheduled_send_at=
        new Date(
          Date.now()+
          3*60*60*1000
        )
        .toISOString();
    }


    const {
      data,
      error
    }=
      await supabase
        .from(
          'diagnostic_reports'
        )
        .update(update)
        .eq(
          'id',
          selectedReport.id
        )
        .select()
        .single();


    if(error){

      showMessage(
        error.message,
        true
      );

      return;
    }


    selectedReport=
      data;


    renderHeader();
    startCountdown();


    showMessage(
      paused
        ? 'Send resumed. A new 3-hour review window has started.'
        : 'Send paused.'
    );


    await loadReports();
  }
);
