<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diagnostic Review | The Creative Lab</title>

<style>
:root{
  --black:#222;
  --charcoal:#343434;
  --grey:#707070;
  --line:#dedede;
  --soft:#f4f4f2;
  --cream:#F5F0E8;
  --sage:#A8AEA0;
  --plum:#6B4D59;
  --sand:#E5DFD3;
  --warm:#E6D8C7;
  --green:#DCE5D8;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  min-height:100%;
  font-family:Arial,Helvetica,sans-serif;
  color:var(--charcoal);
  background:#f4f4f2;
}

button,
input,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none !important;
}

/* LOGIN */

.login-shell{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:30px;
}

.login-card{
  width:min(430px,100%);
  padding:38px;
  background:#fff;
  border-radius:14px;
  box-shadow:0 15px 50px rgba(0,0,0,.08);
}

.login-brand{
  font-size:23px;
  font-weight:800;
  margin-bottom:42px;
}

.login-card h1{
  margin:0 0 10px;
  font-size:32px;
}

.login-card p{
  margin:0 0 28px;
  color:var(--grey);
  font-size:14px;
  line-height:1.5;
}

.field{
  margin-bottom:17px;
}

.field label{
  display:block;
  margin-bottom:7px;
  font-size:12px;
  font-weight:700;
}

.field input{
  width:100%;
  height:46px;
  padding:0 12px;
  border:1px solid #cfcfcf;
  border-radius:5px;
}

.login-button{
  width:100%;
  height:47px;
  border:0;
  border-radius:5px;
  background:#222;
  color:#fff;
  font-weight:700;
}

.login-error{
  min-height:18px;
  margin-top:13px;
  color:#9e3b3b;
  font-size:12px;
}

/* APP SHELL */

.app-shell{
  min-height:100vh;
  display:grid;
  grid-template-columns:205px minmax(0,1fr);
}

.sidebar{
  position:fixed;
  inset:0 auto 0 0;
  width:205px;
  padding:26px 18px;
  background:#202020;
  color:#fff;
  display:flex;
  flex-direction:column;
}

.sidebar-brand{
  font-size:19px;
  font-weight:800;
  margin-bottom:36px;
}

.sidebar-label{
  margin-bottom:9px;
  padding-left:8px;
  font-size:10px;
  letter-spacing:.13em;
  text-transform:uppercase;
  color:#8e8e8e;
}

.sidebar-link{
  display:flex;
  align-items:center;
  gap:10px;
  min-height:42px;
  padding:0 11px;
  border-radius:5px;
  font-size:13px;
  color:#ddd;
}

.sidebar button.sidebar-link{border:0;background:transparent;text-align:left;width:100%;cursor:pointer}
.sidebar-link.active{
  background:#353535;
  color:#fff;
}

.sidebar-spacer{
  flex:1;
}

.signout{
  border:0;
  background:transparent;
  color:#fff;
  text-align:left;
  padding:10px;
  font-size:12px;
}

.main{
  grid-column:2;
  min-width:0;
}

.topbar{
  height:67px;
  padding:0 25px;
  background:#fff;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.topbar-title{
  font-size:17px;
  font-weight:700;
}

.current-user{
  font-size:11px;
  color:var(--grey);
}

/* DIAGNOSTIC LIST VIEW */

.list-view{
  padding:28px;
}

.list-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.list-head h1{
  margin:0;
  font-size:26px;
}

.refresh{
  border:0;
  background:transparent;
  text-decoration:underline;
  font-size:12px;
}

.diagnostic-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:14px;
}

.diagnostic-card{
  padding:19px;
  border:1px solid var(--line);
  border-radius:9px;
  background:#fff;
  text-align:left;
}

.diagnostic-card:hover{
  border-color:#aaa;
}

.card-company{
  font-size:15px;
  font-weight:800;
  margin-bottom:6px;
}

.card-meta{
  font-size:11px;
  line-height:1.5;
  color:var(--grey);
}

.status-pill{
  display:inline-block;
  margin-top:10px;
  padding:5px 8px;
  border-radius:20px;
  background:#eeeae1;
  font-size:9px;
  font-weight:800;
  letter-spacing:.06em;
  text-transform:uppercase;
}

/* REVIEW PAGE */

.review-view{
  min-height:calc(100vh - 67px);
  background:#f2f2f0;
}

.review-header{
  padding:18px 22px;
  background:#fff;
  border-bottom:1px solid var(--line);
}

.back-link{
  display:inline-block;
  margin-bottom:17px;
  border:0;
  background:transparent;
  padding:0;
  font-size:12px;
  color:#555;
}

.review-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:25px;
}

.client-block{
  min-width:0;
}

.client-name{
  font-size:25px;
  font-weight:800;
  margin-bottom:6px;
}

.client-meta{
  font-size:12px;
  color:var(--grey);
  line-height:1.5;
}

.review-actions{
  display:flex;
  align-items:center;
  gap:9px;
}

.timer-box{
  min-width:205px;
  padding:12px 16px;
  border:1px solid var(--line);
  border-radius:7px;
  background:#fff;
}

.timer-label{
  font-size:11px;
  color:var(--grey);
  margin-bottom:4px;
}

.timer-value{
  font-size:14px;
  font-weight:700;
}

.timer-date{
  margin-top:3px;
  font-size:10px;
  color:#8a8a8a;
}

.action-button{
  height:42px;
  padding:0 15px;
  border:1px solid #cfcfcf;
  border-radius:5px;
  background:#fff;
  font-size:12px;
  font-weight:700;
}

.action-button.dark{
  background:#222;
  border-color:#222;
  color:#fff;
}

.action-button:disabled{
  opacity:.4;
  cursor:not-allowed;
}

/* 3 PANEL WORKSPACE */

.workspace{
  display:grid;
  grid-template-columns:245px minmax(330px,.9fr) minmax(420px,1.15fr);
  min-height:calc(100vh - 185px);
}

.section-nav{
  background:#fff;
  border-right:1px solid var(--line);
  padding:20px 14px;
}

.section-nav-title{
  margin:0 8px 14px;
  font-size:14px;
  font-weight:800;
}

.section-button{
  width:100%;
  min-height:43px;
  padding:0 12px;
  border:0;
  border-bottom:1px solid #e8e8e8;
  background:#fff;
  text-align:left;
  font-size:12px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.section-button:hover{
  background:#f8f8f7;
}

.section-button.active{
  background:#eeeeec;
  font-weight:700;
}

.section-arrow{
  color:#999;
  font-size:14px;
}

/* EDITOR */

.editor-panel{
  min-width:0;
  background:#fafafa;
  border-right:1px solid var(--line);
  display:flex;
  flex-direction:column;
}

.panel-head{
  height:55px;
  padding:0 17px;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  font-size:14px;
  font-weight:800;
  background:#fff;
}

.editor-content{
  flex:1;
  padding:20px;
}

.editor-section-title{
  font-size:16px;
  font-weight:800;
  margin-bottom:18px;
}

.editor-field{
  margin-bottom:18px;
}

.editor-field label{
  display:block;
  margin-bottom:7px;
  font-size:10px;
  font-weight:800;
  letter-spacing:.04em;
  text-transform:uppercase;
  color:#666;
}

.editor-input{
  width:100%;
  min-height:210px;
  padding:13px;
  border:1px solid #ccc;
  border-radius:5px;
  resize:vertical;
  background:#fff;
  line-height:1.45;
  font-size:13px;
}

.editor-input.headline{
  min-height:80px;
  font-weight:700;
}

.editor-footer{
  padding:14px 18px;
  border-top:1px solid var(--line);
  background:#fff;
  display:flex;
  justify-content:flex-end;
  gap:9px;
}

.save-button{
  min-height:41px;
  padding:0 18px;
  border:0;
  border-radius:5px;
  background:#222;
  color:#fff;
  font-size:12px;
  font-weight:700;
}

.cancel-button{
  min-height:41px;
  padding:0 18px;
  border:1px solid #ccc;
  border-radius:5px;
  background:#fff;
  font-size:12px;
  font-weight:700;
}

/* PREVIEW */

.preview-panel{
  min-width:0;
  background:#f1f1ef;
}

.preview-head{
  height:55px;
  padding:0 16px;
  border-bottom:1px solid var(--line);
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.preview-head strong{
  font-size:14px;
}

.preview-switch{
  display:flex;
  gap:5px;
}

.preview-toggle{
  height:31px;
  padding:0 12px;
  border:1px solid #ddd;
  background:#fff;
  font-size:11px;
}

.preview-toggle.active{
  border-bottom:2px solid #222;
  font-weight:700;
}

.preview-scroll{
  height:calc(100vh - 240px);
  overflow:auto;
  padding:22px;
}

.email{
  width:100%;
  max-width:620px;
  margin:0 auto;
  padding:30px;
  background:var(--cream);
  transition:max-width .2s ease;
}

.email.mobile{
  max-width:360px;
}

.email-brand{
  margin-bottom:24px;
  font-size:11px;
  font-weight:800;
  letter-spacing:.12em;
  text-transform:uppercase;
}

.email p{
  margin:0 0 16px;
  font-size:13px;
  line-height:1.5;
}

.email h3{
  margin:26px 0 8px;
  font-size:12px;
  text-transform:uppercase;
}

/* Brand Pulse score panel — XD reference */
.score-panel{margin:21px 0 27px;padding:15px 20px;border-radius:13px;background:var(--sage);display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:174px}
.score-panel-title{flex:1;min-width:0;color:#222;font-size:clamp(20px,2.4vw,27px);line-height:1.09;letter-spacing:-.035em}
.score-panel-title strong,.score-panel-title span{display:block}
.score-panel-title strong{font-weight:900}
.score-panel-title span{font-weight:400}
.score-donut{position:relative;width:147px;height:147px;flex:0 0 147px}
.score-donut svg{display:block;width:100%;height:100%}
.score-donut-centre{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.score-donut-value{font-size:49px;line-height:.88;letter-spacing:-.045em;font-weight:900;color:var(--cream)}
.score-donut-divider{width:55px;height:1px;margin:2px 0 4px;background:var(--charcoal)}
.score-donut-total{font-size:28px;font-weight:300;line-height:.99;color:#111}
.email.mobile .score-panel{padding:9px;gap:6px;min-height:112px}
.email.mobile .score-panel-title{font-size:14px}
.email.mobile .score-donut{width:96px;height:96px;flex-basis:96px}
.email.mobile .score-donut-value{font-size:32px}
.email.mobile .score-donut-total{font-size:18px}
.email.mobile .score-donut-divider{width:37px;margin:1px 0 3px}
.email-contacts{
  margin-top:24px;
  background:#D6D9D1;
  border-radius:14px;
  padding:22px 12px;
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  font-size:11px;
  text-align:center;
  line-height:1.5;
}
.email-contacts .person{padding:0 7px;min-width:0}
.email-contacts .person:first-child{border-right:1px solid #8f918c}
.email-contacts a{color:var(--charcoal);text-decoration:underline;overflow-wrap:anywhere}

.divider{
  height:1px;
  margin:25px 0;
  background:#aaa;
}

.area{
  display:grid;
  grid-template-columns:70px 1fr;
  gap:15px;
  padding:18px 0;
  border-bottom:1px solid #aaa;
}

.area-circle{
  width:62px;
  height:62px;
  border-radius:50%;
  background:#ddd8cf;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  font-size:21px;
  font-weight:800;
  line-height:1;
}

.area-circle small{
  margin-top:4px;
  font-size:9px;
  font-weight:400;
}

.area-title{
  margin-bottom:5px;
  font-size:13px;
  font-weight:800;
}

.area-headline{
  margin-bottom:5px;
  font-size:13px;
  line-height:1.35;
  font-weight:700;
}

.area-copy{
  font-size:12px;
  line-height:1.5;
}

.path{
  padding:14px 0;
  border-top:1px solid #aaa;
}

.path strong{
  font-size:12px;
}

.book-call{
  width:180px;
  margin:24px auto;
  padding:12px;
  border-radius:4px;
  background:var(--plum);
  color:#fff;
  text-align:center;
  font-size:12px;
  font-weight:700;
}

.message{
  margin:12px 22px 0;
  padding:10px 13px;
  border-radius:5px;
  background:var(--green);
  font-size:11px;
}

.message.warning{
  background:#f0ded0;
}

@media(max-width:1150px){
  .workspace{
    grid-template-columns:210px minmax(300px,1fr);
  }

  .preview-panel{
    display:none;
  }
}

@media(max-width:760px){
  .app-shell{
    display:block;
  }

  .sidebar{
    position:static;
    width:100%;
    height:58px;
    padding:0 15px;
    flex-direction:row;
    align-items:center;
  }

  .sidebar-brand{
    margin:0;
  }

  .sidebar-label,
  .sidebar-link{
    display:none;
  }

  .sidebar-spacer{
    flex:1;
  }

  .main{
    width:100%;
  }

  .review-top{
    flex-direction:column;
  }

  .review-actions{
    width:100%;
    flex-wrap:wrap;
  }

  .timer-box{
    width:100%;
  }

  .workspace{
    display:block;
  }

  .section-nav{
    border-right:0;
    border-bottom:1px solid var(--line);
  }

  .editor-panel{
    border-right:0;
  }
}
</style>
</head>

<body>

<div id="loginScreen" class="login-shell">

  <div class="login-card">

    <div class="login-brand">
      The Creative Lab
    </div>

    <h1>
      Diagnostic Review
    </h1>

    <p>
      Private access for authorised Creative Lab reviewers.
    </p>

    <div class="field">
      <label>Email</label>
      <input id="loginEmail" type="email">
    </div>

    <div class="field">
      <label>Password</label>
      <input id="loginPassword" type="password">
    </div>

    <button id="loginButton" class="login-button">
      Sign In
    </button>

    <div id="loginError" class="login-error"></div>

  </div>

</div>


<div id="appScreen" class="app-shell hidden">

  <aside class="sidebar">

    <div class="sidebar-brand">
      The Creative Lab
    </div>

    <div class="sidebar-label">
      Internal
    </div>

    <button type="button" class="sidebar-link active" data-folder="overview">Overview</button>
    <button type="button" class="sidebar-link" data-folder="new">New Submissions</button>
    <button type="button" class="sidebar-link" data-folder="attention">Needs Attention <span id="attentionCount"></span></button>
    <button type="button" class="sidebar-link" data-folder="scheduled">Scheduled</button>
    <button type="button" class="sidebar-link" data-folder="sent">Sent Reports</button>
    <button type="button" class="sidebar-link" data-folder="all">All Submissions</button>

    <div class="sidebar-spacer"></div>

    <button id="signOutButton" class="signout">
      Log out
    </button>

  </aside>


  <main class="main">

    <header class="topbar">

      <div class="topbar-title">
        Brand Performance Diagnostic
      </div>

      <div id="currentUser" class="current-user"></div>

    </header>


    <section id="listView" class="list-view">

      <div class="list-head">

        <h1>
          Diagnostics
        </h1>

        <button id="refreshButton" class="refresh">
          Refresh
        </button>

      </div>

      <div id="diagnosticGrid" class="diagnostic-grid"></div>

    </section>


    <section id="reviewView" class="review-view hidden">

      <div class="review-header">

        <button id="backButton" class="back-link">
          ← Back to diagnostics
        </button>


        <div class="review-top">

          <div class="client-block">

            <div id="clientName" class="client-name"></div>

            <div id="clientMeta" class="client-meta"></div>

          </div>


          <div class="review-actions">

            <div class="timer-box">

              <div class="timer-label">
                Scheduled to send
              </div>

              <div id="timerValue" class="timer-value"></div>

              <div id="timerDate" class="timer-date"></div>

            </div>


            <button id="pauseButton" class="action-button">
              Pause Send
            </button>

            <button id="approveButton" class="action-button dark">
              Approve &amp; Send
            </button>

          </div>

        </div>

      </div>


      <div id="statusMessage"></div>


      <div class="workspace">

        <aside class="section-nav">

          <div class="section-nav-title">
            Edit email content
          </div>

          <div id="sectionNav"></div>

        </aside>


        <section class="editor-panel">

          <div class="panel-head">
            Edit section
          </div>

          <div id="editorContent" class="editor-content"></div>

          <div class="editor-footer">

            <button id="cancelButton" class="cancel-button">
              Cancel
            </button>

            <button id="saveButton" class="save-button">
              Save Changes
            </button>

          </div>

        </section>


        <section class="preview-panel">

          <div class="preview-head">

            <strong>
              Email preview
            </strong>

            <div class="preview-switch">

              <button
                id="desktopButton"
                class="preview-toggle active"
              >
                Desktop
              </button>

              <button
                id="mobileButton"
                class="preview-toggle"
              >
                Mobile
              </button>

            </div>

          </div>

          <div class="preview-scroll">

            <div id="emailPreview"></div>

          </div>

        </section>

      </div>

    </section>

  </main>

</div>


<script type="module">

function escapeHtml(value){

  return String(value ?? '')
    .replace(
      /[&<>"']/g,
      ch=>({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#039;'
      })[ch]
    );
}


function formatDate(value){

  if(!value){
    return '';
  }


  return new Date(value)
    .toLocaleString(
      'en-GB',
      {
        dateStyle:'medium',
        timeStyle:'short'
      }
    );
}


function firstName(value){

  return String(value || '')
    .trim()
    .split(/\s+/)[0] ||
    'there';
}

async function loadReports(){

  diagnosticGrid.innerHTML =
    'Loading…';


  const {
    data,
    error
  }=
    await supabase
      .from('diagnostic_reports')
      .select('*')
      .order(
        'created_at',
        {
          ascending:false
        }
      );


  if(error){

    diagnosticGrid.innerHTML=
      escapeHtml(error.message);

    return;
  }


  reports=data||[];
  try{
    const {data:{session}}=await supabase.auth.getSession();
    const resp=await fetch('/.netlify/functions/brandpulse-recovery',{headers:{Authorization:`Bearer ${session.access_token}`}});
    if(resp.ok)submissions=(await resp.json()).submissions||[];
  }catch(e){console.error('Cannot load submission queue',e);}
  renderDiagnosticCards();
}


function renderDiagnosticCards(){
  const heading=document.querySelector('.list-head h1');
  const labels={overview:'Overview',new:'New Submissions',attention:'Needs Attention',scheduled:'Scheduled',sent:'Sent Reports',all:'All Submissions'};
  heading.textContent=labels[activeFolder];
  const pending=submissions.filter(s=>s.status!=='completed');
  const attention=pending.filter(s=>s.status==='failed');
  document.getElementById('attentionCount').textContent=attention.length?`(${attention.length})`:'';
  document.querySelectorAll('[data-folder]').forEach(b=>b.classList.toggle('active',b.dataset.folder===activeFolder));
  const filteredReports=reports.filter(r=>
    activeFolder==='all'||activeFolder==='overview'||
    (activeFolder==='new'&&r.status==='draft')||
    (activeFolder==='attention'&&r.status==='delivery_error')||
    (activeFolder==='scheduled'&&['draft','approved','paused'].includes(r.status))||
    (activeFolder==='sent'&&r.status==='sent'));
  const filteredPending=pending.filter(s=>
    activeFolder==='all'||activeFolder==='overview'||
    (activeFolder==='new'&&s.status!=='failed')||
    (activeFolder==='attention'&&s.status==='failed'));
  const cards=[...filteredPending.map(s=>`<div class="diagnostic-card" data-submission="${s.id}">
   <div class="card-company">${escapeHtml(s.payload?.client?.company||'Unnamed submission')}</div>
   <div class="card-meta">${escapeHtml(s.payload?.client?.contact_name||'')}<br>${formatDate(s.created_at)}</div>
   <span class="status-pill">${s.status==='failed'?'Generation failed':s.status==='queued'?'Queued':s.status==='writing'?'Writing':'Researching'}</span>
   ${s.status==='failed'?`<p class="card-meta">${escapeHtml(s.last_error||'Needs regeneration')}</p><button class="action-button dark" data-retry="${s.id}">Regenerate Report</button>`:''}
   </div>`),...filteredReports.map(r=>`<button class="diagnostic-card" data-id="${r.id}">
   <div class="card-company">${escapeHtml(r.company_name)}</div>
   <div class="card-meta">${escapeHtml(r.client_name||'')}<br>${escapeHtml(String(r.overall_score))}/100 · ${formatDate(r.created_at)}</div>
   <span class="status-pill">${escapeHtml(r.status)}</span></button>`)].join('');
  diagnosticGrid.innerHTML=cards||'No submissions in this folder.';
  diagnosticGrid.querySelectorAll('[data-id]').forEach(button=>button.addEventListener('click',()=>{
    const report=reports.find(r=>r.id===button.dataset.id);if(report)openReport(report);
  }));
  diagnosticGrid.querySelectorAll('[data-retry]').forEach(button=>button.addEventListener('click',async()=>{
    button.disabled=true;button.textContent='Queuing…';
    try{
      const {data:{session}}=await supabase.auth.getSession();
      const response=await fetch('/.netlify/functions/brandpulse-recovery',{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${session.access_token}`},body:JSON.stringify({action:'retry',id:button.dataset.retry})});
      const result=await response.json();if(!response.ok)throw Error(result.error||'Retry failed');
      await loadReports();
    }catch(e){alert(e.message);button.disabled=false;button.textContent='Regenerate Report';}
  }));
}

  function pulseArcSvg(score){
    const value=Math.max(0,Math.min(100,Number(score)||0));
    const angle=value*3.6;
    const radius=45;
    const position=degrees=>{
      const rad=(degrees-90)*Math.PI/180;
      return [60+radius*Math.cos(rad),60+radius*Math.sin(rad)];
    };
    const [endX,endY]=position(angle);
    const gradientId='pulse-score-gradient';
    const progress=value<=0?'':value>=100
      ? `<circle cx="60" cy="60" r="45" fill="none" stroke="url(#${gradientId})" stroke-width="16"/>`
      : `<path d="M 60 15 A 45 45 0 ${angle>180?1:0} 1 ${endX.toFixed(3)} ${endY.toFixed(3)}"
          fill="none" stroke="url(#${gradientId})" stroke-width="16" stroke-linecap="round"/>`;
    // Pale at the trailing 12 o'clock start; deep plum at the moving tip.
    // One continuous path eliminates the fine seams from the previous segmented build.
    return `<svg viewBox="0 0 120 120" aria-hidden="true" focusable="false">
      <defs><linearGradient id="${gradientId}" gradientUnits="userSpaceOnUse"
          x1="60" y1="15" x2="${Math.abs(endX-60)<0.01&&Math.abs(endY-15)<0.01?105:endX.toFixed(3)}"
          y2="${Math.abs(endX-60)<0.01&&Math.abs(endY-15)<0.01?60:endY.toFixed(3)}">
        <stop offset="0%" stop-color="#C7B3BB"/>
        <stop offset="100%" stop-color="#6B4D59"/>
      </linearGradient></defs>
      <circle cx="60" cy="60" r="45" fill="none" stroke="#F5F0E8" stroke-width="16"/>
      ${progress}
    </svg>`;
  }

  

function scoreDonut(score){
  const shown=Math.round(Math.max(0,Math.min(100,Number(score)||0)));
  return `<div class="score-donut" role="img" aria-label="Brand Pulse performance score: ${shown} out of 100">
    ${pulseArcSvg(score)}
    <div class="score-donut-centre" aria-hidden="true">
      <div class="score-donut-value">${shown}</div>
      <div class="score-donut-divider"></div>
      <div class="score-donut-total">100</div>
    </div></div>`;
}

function startCountdown(){

  if(countdownTimer){

    clearInterval(
      countdownTimer
    );
  }


  updateCountdown();


  countdownTimer=
    setInterval(
      updateCountdown,
      1000
    );
}


function updateCountdown(){

  if(!selectedReport){
    return;
  }


  if(
    selectedReport.status===
    'paused'
  ){

    timerValue.textContent=
      'Send paused';

    timerDate.textContent=
      'Waiting for reviewer approval';

    return;
  }


  if(
    selectedReport.status===
    'sent'
  ){

    timerValue.textContent=
      'Email sent';

    timerDate.textContent=
      formatDate(
        selectedReport.sent_at
      );

    return;
  }


  if(['sending','delivery_error'].includes(selectedReport.status)){
    timerValue.textContent=selectedReport.status==='sending'?'Email sending':'Delivery needs review';
    timerDate.textContent=selectedReport.delivery_error||'';
    return;
  }

  if(
    selectedReport.status===
    'approved'
  ){

    timerValue.textContent=
      'Approved for sending';

    timerDate.textContent=
      formatDate(
        selectedReport.approved_at
      );

    return;
  }


  const sendTime=
    new Date(
      selectedReport.scheduled_send_at
    ).getTime();


  const diff=
    sendTime-
    Date.now();


  if(diff<=0){

    timerValue.textContent=
      'Scheduled send time reached';

    timerDate.textContent=
      formatDate(
        selectedReport.scheduled_send_at
      );

    return;
  }


  const hours=
    Math.floor(
      diff/
      3600000
    );


  const minutes=
    Math.floor(
      (
        diff%
        3600000
      )/
      60000
    );


  timerValue.textContent=
    `in ${hours}h ${minutes}m`;


  timerDate.textContent=
    formatDate(
      selectedReport.scheduled_send_at
    );
}

// Reviewer actions are handled on the server with the same delivery-mode safeguards
// as the scheduled sender. Never call the Resend API directly from this page.
async function reviewerAction(action, report_json){
  const {data:{session},error:sessionError}=await supabase.auth.getSession();
  if(sessionError||!session?.access_token) throw new Error('Please sign in again.');
  const response=await fetch('/.netlify/functions/brandpulse-review-action',{
    method:'POST',
    headers:{'Content-Type':'application/json',Authorization:`Bearer ${session.access_token}`},
    body:JSON.stringify({action,report_id:selectedReport.id,report_json})
  });
  const result=await response.json().catch(()=>({}));
  if(!response.ok)throw new Error(result.error||'The action failed.');
  if(!result.report)throw new Error('The server did not return an updated report.');
  selectedReport=result.report;
  renderHeader();
  startCountdown();
  renderPreview();
  await loadReports();
  return result.message;
}

      reports.find(
        r=>
          r.id===

          JSON.stringify(

  pauseButton.disabled=true;
  try{
    const action=selectedReport.status==='paused'?'resume':'pause';

    showMessage(message);
  }catch(error){showMessage(error.message,true);}
  finally{renderHeader();}
});

  if(!window.confirm('Send this report now? This will email the recipient immediately if delivery mode permits.'))return;
  approveButton.disabled=true;
  pauseButton.disabled=true;
  saveButton.disabled=true;
  try{
    const message=await reviewerAction('approve',collectFields());
